<!doctype html>
<html lang="en">
  <head>
    <!-- kc-debug type={{ .Type }} layout={{ .Layout }} title={{ .Title }} rel={{ .RelPermalink }} permalink={{ .Permalink }} kind={{ .Kind }} section={{ .Section }} -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ block "title" . }}{{ if .Title }}{{ .Title }} | {{ end }}The Kings Centre Southall{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}The Kings Centre Southall brings people together through youth work, community programmes and practical training.{{ end }}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231a6261'/%3E%3Cpath d='M17 16v32M17 32l26-16M17 32l29 17' stroke='%23f39200' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/kc-site.css">
    {{ partial "microblog_head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {{ partial "site-header.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "site-footer.html" . }}
    <script src="/js/kc-site.js"></script>
  </body>
</html>
